set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -s escape-time 0

# Prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Appearance
set -g base-index 1
setw -g pane-base-index 1

# New panes/windows in current directory
bind '"' split-window -v -c "#{pane_current_path}"
bind '%' split-window -h -c "#{pane_current_path}"
bind 'c' new-window -c "#{pane_current_path}"

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Mouse support
set -g mouse on

# History
set -g history-limit 50000

# Plugin paths (expanded at runtime)
run-shell 'tmux set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/personal/tmux/plugins"'

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'catppuccin/tmux#v2.3.0'

# Resurrect settings
set -g @resurrect-dir '~/personal/tmux/sessions'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'

# Catppuccin settings
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"

# Initialize TPM (keep at bottom)
run '~/personal/tmux/plugins/tpm/tpm'

# Status line (after TPM init so catppuccin modules resolve)
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}#{E:@catppuccin_status_session}"
